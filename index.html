<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="직접 만든 수업 활동과 실험 앱을 한곳에서 찾아 실행하는 서재">
  <title>나의 수업 앱 서재</title>
  <link rel="stylesheet" href="styles.css?v=20261106-compact-subjects">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">MY TEACHING LAB</p>
        <h1>나의 수업 앱 서재</h1>
        <p>만든 활동을 잊어버리지 않도록 한곳에 모았습니다. 수업 전에 찾아서 바로 실행해 보세요.</p>
      </div>
      <div class="count-card" aria-label="등록된 앱 수">
        <span>현재 모아둔 앱</span>
        <strong id="appCount">0</strong>
        <small>앞으로 계속 늘어납니다</small>
      </div>
    </header>


    <section class="toolbox" aria-label="앱 검색과 분류">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="앱 이름이나 수업 주제로 검색" autocomplete="off">
      </label>
      <div class="filters" id="filters" aria-label="과목 분류"></div>
    </section>


    <section>
      <div class="section-heading">

        <p id="resultText">전체 앱을 보여드려요.</p>
      </div>


      <div class="app-grid" id="appGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <span>🔎</span>
        <strong>검색 결과가 없습니다.</strong>
        <p>다른 검색어나 분류를 선택해 보세요.</p>
      </div>
    </section>


    <footer class="site-footer">창원대암고등학교 교사 배미란</footer>
  </main>
  <script src="app.js?v=20261106-compact-subjects"></script>
</body>
</html>
